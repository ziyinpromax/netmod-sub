<p class="note" id="intro">Link တွေကို အောက်မှာ ကြည့်နိုင်ပါတယ်။ Copy All ကို နှိပ်ပြီး NetMod မှာ Import from clipboard လုပ်ပါ။</p>

<p class="err hidden" id="gateErr">Password မှားပါတယ်။</p>
</div>
<div id="content" class="hidden">
<p><button class="primary" id="copyAllBtn" type="button">Copy All</button><span id="copiedMsg" class="note"></span></p>
<div id="groups"></div>
</div>

function b64ToBytes(s){var bin=atob(s);var out=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++){out[i]=bin.charCodeAt(i);}return out;}
function bytesToText(b){return new TextDecoder().decode(b);}
function textToBytes(s){return new TextEncoder().encode(s);}
async function deriveKey(password,salt){
  var base=await crypto.subtle.importKey("raw",textToBytes(password),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},base,256);
  return crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"]);
}
function normHwid(s){return String(s||"").trim().toUpperCase();}
async function openBundle(secret){
  if(ENVELOPE.enc===0){return ENVELOPE.data;}
  if(ENVELOPE.enc===2){
    var hwid=normHwid(secret);
    var envs=ENVELOPE.envelopes||[];
    for(var i=0;i<envs.length;i++){
      try{
        var key=await deriveKey(hwid,b64ToBytes(envs[i].salt));
        var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(envs[i].iv)},key,b64ToBytes(envs[i].ct));
        return JSON.parse(bytesToText(new Uint8Array(pt)));
      }catch(e){/* try the next envelope */}
    }
    throw new Error("bad hwid");
  }
  if(ENVELOPE.enc!==1){throw new Error("bad envelope");}
  var key=await deriveKey(secret,b64ToBytes(ENVELOPE.salt));
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(ENVELOPE.iv)},key,b64ToBytes(ENVELOPE.ct));
  return JSON.parse(bytesToText(new Uint8Array(pt)));
}
function bundleToText(bundle){
  var lines=[];
  var cats=bundle.categories||[];
  for(var i=0;i<cats.length;i++){
    var links=cats[i].links||[];
    for(var j=0;j<links.length;j++){
      var parts=String(links[j].link||"").split(/\r?\n/);
      for(var k=0;k<parts.length;k++){
        var t=parts[k].trim();
        if(t){lines.push(t);}
      }
    }
  }
  return lines.join("\n");
}
function copyText(text,msgEl){
  function done(){if(msgEl){msgEl.textContent="ကူးပြီးပြီ";}}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){fallback();});
  }else{fallback();}
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);done();
  }
}
function el(tag,cls,text){
  var e=document.createElement(tag);
  if(cls){e.className=cls;}
  if(text!==undefined&&text!==null){e.textContent=text;}
  return e;
}
function render(bundle){
  var title=document.getElementById("title");
  if(bundle.name){title.textContent=bundle.name;}
  var groups=document.getElementById("groups");
  groups.textContent="";
  var copiedMsg=document.getElementById("copiedMsg");
  var cats=bundle.categories||[];
  for(var i=0;i<cats.length;i++){
    (function(cat){
      var h=el("h2",null,cat.name||"");
      groups.appendChild(h);
      var groupLinks=cat.links||[];
      var gb=el("button",null,"ဒီအုပ်စုကို Copy");
      gb.onclick=function(){
        var parts=[];
        for(var j=0;j<groupLinks.length;j++){
          var ps=String(groupLinks[j].link||"").split(/\r?\n/);
          for(var k=0;k<ps.length;k++){var t=ps[k].trim();if(t){parts.push(t);}}
        }
        copyText(parts.join("\n"),copiedMsg);
      };
      groups.appendChild(gb);
      for(var j=0;j<groupLinks.length;j++){
        (function(entry){
          var row=el("div","row",null);
          row.appendChild(el("div","remark",entry.remark||""));
          row.appendChild(el("div","link",entry.link||""));
          var b=el("button",null,"Copy");
          b.onclick=function(){copyText(String(entry.link||"").trim(),copiedMsg);};
          row.appendChild(b);
          groups.appendChild(row);
        })(groupLinks[j]);
      }
    })(cats[i]);
  }
  var copyAll=document.getElementById("copyAllBtn");
  copyAll.onclick=function(){copyText(bundleToText(bundle),copiedMsg);};
  document.getElementById("content").className="";
  document.getElementById("gate").className="hidden";
}
function showFatal(){
  document.getElementById("gate").className="hidden";
  document.getElementById("content").className="hidden";
  document.getElementById("fatalErr").className="err";
}
async function init(){
  try{
    if(ENVELOPE.enc===0){
      render(await openBundle(""));
    }else{
      var isHwid=ENVELOPE.enc===2;
      document.getElementById("gate").className="";
      document.getElementById("gatePrompt").textContent=isHwid?"HWID ရိုက်ပါ။":"Password ရိုက်ပါ။";
      document.getElementById("pw").className=isHwid?"hidden":"";
      document.getElementById("hwid").className=isHwid?"":"hidden";
      document.getElementById("gateErr").textContent=isHwid?"HWID မကိုက်ညီပါ။":"Password မှားပါတယ်။";
      document.getElementById("openBtn").onclick=async function(){
        document.getElementById("gateErr").className="err hidden";
        var secret=isHwid?document.getElementById("hwid").value:document.getElementById("pw").value||"";
        try{render(await openBundle(secret));}
        catch(e){document.getElementById("gateErr").className="err";}
      };
      document.getElementById("pw").onkeydown=function(ev){
        if(ev&&ev.key==="Enter"){document.getElementById("openBtn").onclick();}
      };
      document.getElementById("hwid").onkeydown=function(ev){
        if(ev&&ev.key==="Enter"){document.getElementById("openBtn").onclick();}
      };
      document.getElementById("hwid").oninput=function(ev){
        if(ev&&ev.target){ev.target.value=normHwid(ev.target.value);}
      };
    }
  }catch(e){showFatal();}
}
if(typeof window!=="undefined"){
  window.__subTest={openBundle:openBundle,bundleToText:bundleToText,render:render,ENVELOPE:ENVELOPE};
}
init();
